<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booth Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1c1229; --panel: #261a36; --line: #3b2c50; --text: #f3ecdc; --muted: #a596b8;
    --lime: #b9d531; --orange: #ef7d2e; --teal: #7cc6b8; --red: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 500 14px/1.45 'Fredoka', system-ui, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 18px; color: var(--lime); }
  header .models { color: var(--muted); font-size: 12px; }
  header a { margin-left: auto; color: var(--teal); }
  .conn-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #6d5f80; margin-right: 6px; vertical-align: 1px; }
  main { flex: 1; display: grid; grid-template-columns: 220px minmax(0, 1fr) minmax(380px, 40%); min-height: 0; }
  section { min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
  section:last-child { border-right: 0; overflow-y: auto; }
  h2 { margin: 0; padding: 12px 14px 6px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }

  #files { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  #files .group { margin: 10px 6px 4px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  #files button { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--text); padding: 5px 8px; border-radius: 6px; cursor: pointer; font: inherit; }
  #files button:hover { background: var(--panel); }
  #files button.active { background: var(--line); color: var(--lime); }
  .new-story { display: flex; gap: 6px; padding: 8px 14px; border-top: 1px solid var(--line); }
  .new-story input { flex: 1; min-width: 0; }

  .editor-bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .editor-bar .name { font-family: 'JetBrains Mono', monospace; font-size: 13px; }
  .editor-bar .status { color: var(--muted); font-size: 12px; margin-left: auto; }
  textarea#editor { flex: 1; resize: none; border: 0; outline: 0; padding: 14px 16px; background: var(--bg); color: var(--text); font: 13px/1.6 'JetBrains Mono', monospace; tab-size: 2; }

  input, select { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: inherit; }
  button.btn { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; }
  button.btn:hover { border-color: var(--muted); }
  button.primary { background: var(--orange); border-color: var(--orange); color: #fff; font-weight: 700; }
  button:disabled { opacity: 0.5; cursor: default; }

  .test { padding: 0 14px 14px; display: grid; gap: 10px; }
  .photo-row { display: flex; gap: 12px; align-items: flex-start; }
  .photo { width: 120px; aspect-ratio: 1; border-radius: 10px; background: var(--panel) center/cover; border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); font-size: 12px; text-align: center; overflow: hidden; flex: none; }
  .photo video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  .photo-actions { display: grid; gap: 6px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row label { color: var(--muted); font-size: 12px; }
  #stage { color: var(--teal); min-height: 20px; }
  #stage.err { color: var(--red); }

  .result { padding: 0 14px 14px; display: grid; gap: 10px; }
  .desc { background: var(--panel); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
  .desc b { color: var(--muted); font-weight: 500; display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
  .attempt { background: var(--panel); border-radius: 10px; overflow: hidden; border: 2px solid transparent; }
  .attempt.final { border-color: var(--lime); }
  .attempt img { width: 100%; display: block; cursor: zoom-in; background: #000; }
  .attempt .meta { padding: 8px 12px; font-size: 13px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 99px; font-weight: 700; font-size: 12px; margin-right: 6px; }
  .pass { background: var(--lime); color: #1c1229; }
  .fail { background: var(--red); color: #1c1229; }
  .attempt ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); }
  .back-panel { display: grid; gap: 8px; padding: 4px 14px 14px; border-top: 1px solid var(--line); }
  .back-panel h2 { padding: 8px 0 0; }
  .back-panel .check { color: var(--muted); font-size: 12px; display: flex; gap: 6px; align-items: center; }
  .back-panel button.print { margin-top: 0; }
  .photo.back { width: 100px; justify-self: center; aspect-ratio: 7 / 11; background-size: contain; background-repeat: no-repeat; background-color: #fff; }
  button.print { margin-top: 8px; background: var(--teal); border-color: var(--teal); color: #1c1229; font-weight: 700; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; margin-top: 6px; }
  details pre { white-space: pre-wrap; font: 11px/1.5 'JetBrains Mono', monospace; color: var(--muted); max-height: 300px; overflow: auto; }

  .runs { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; padding: 0 14px 14px; }
  .runs button { padding: 0; border: 2px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); cursor: pointer; color: var(--muted); font: 11px 'Fredoka', sans-serif; text-align: left; }
  .runs button.passed { border-color: var(--lime); }
  .runs button.failed { border-color: var(--red); }
  .runs img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; background: #000; }
  .runs span { display: block; padding: 3px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<header>
  <h1>Booth Admin</h1>
  <span class="models" id="models"></span>
  <label for="printer" class="models" style="margin-left:auto">Printer</label><select id="printer"></select>
  <a href="/connections" id="connections-link" style="margin-left:0"><span id="conn-dot" class="conn-dot"></span>Connections</a>
  <a href="/led" target="_blank" style="margin-left:0">LED mock</a>
</header>
<main>
  <section>
    <h2>Files</h2>
    <div id="files"></div>
    <form class="new-story" id="new-story">
      <input id="new-story-id" placeholder="new-story-id" pattern="[a-z0-9-]+" required>
      <button class="btn">Add</button>
    </form>
    <div class="back-panel">
      <h2>Card back</h2>
      <div class="photo back" id="back-preview">No design yet</div>
      <label class="btn" style="text-align:center">Upload back design<input type="file" id="back-upload" accept="image/*" hidden></label>
      <label class="check"><input type="checkbox" id="back-rotate"> Rotate 180°</label>
      <label class="check">Copies <input type="number" id="back-copies" min="1" max="100" value="1" style="width:70px"></label>
      <button class="btn print" id="print-back">Print card back</button>
      <div id="back-status" class="models"></div>
    </div>
  </section>

  <section>
    <div class="editor-bar">
      <span class="name" id="file-name">Pick a file</span>
      <span class="status" id="save-status"></span>
      <button class="btn primary" id="save" disabled>Save</button>
    </div>
    <textarea id="editor" spellcheck="false" disabled></textarea>
  </section>

  <section>
    <h2>Test run</h2>
    <div class="test">
      <div class="photo-row">
        <div class="photo" id="photo">No photo</div>
        <div class="photo-actions">
          <label class="btn" style="text-align:center">Upload photo<input type="file" id="upload" accept="image/*" hidden></label>
          <button class="btn" id="webcam">Use webcam</button>
          <button class="btn" id="snap" hidden>Snap</button>
        </div>
      </div>
      <div class="row">
        <label for="story">Story</label><select id="story"></select>
      </div>
      <div class="row">
        <label for="attempts">Max attempts</label><input id="attempts" type="number" min="1" max="2" value="1" style="width:60px">
        <label><input type="checkbox" id="auto-print"> Print when done</label>
        <button class="btn primary" id="run" disabled>Run</button>
      </div>
      <div id="stage"></div>
    </div>
    <div class="result" id="result"></div>

    <h2>Recent runs</h2>
    <div class="runs" id="runs"></div>
  </section>
</main>
<script src="/admin.js" type="module"></script>
</body>
</html>
