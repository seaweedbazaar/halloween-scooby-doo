; Build and upload this sketch with PlatformIO (from this folder): pio run -t upload
; Close the booth app first: it holds the Mega's USB port. Add --upload-port COM5 if it picks the wrong port.
[platformio]
src_dir = .

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit MCP4728
  adafruit/Adafruit LED Backpack Library
  adafruit/Adafruit GFX Library
  adafruit/Adafruit NeoPixel
  adafruit/Adafruit BusIO
